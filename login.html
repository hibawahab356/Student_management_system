



<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - StudentSphere</title>

    <link rel="stylesheet" href="./style.css">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet">

   



</head>

<body>

    <nav class="navbar portal-nav">

        <div class="container">

            <a class="navbar-brand" href="welcome.html">

                <img src="./images/logo2.png"
                    alt="StudentSphere Logo"
                    class="logo newLogo">

            </a>

        </div>

    </nav>


    <main class="login-section">

        <div class="container">

            <div class="login-card row g-0">

                <div class="col-lg-6 login-form-box">

                    <div class="login-form">

                        <span class="small-title">
                            STUDENTSPHERE
                        </span>

                        <h1>Welcome Back!</h1>

                        <p class="login-text">
                            Login to continue your student journey.
                        </p>

                        <form id="loginForm">

                            <div class="mb-4">

                                <label class="form-label">
                                    Email
                                </label>

                                <input type="email"
                                    class="form-control"
                                    id="loginEmail"
                                    name="email"
                                    placeholder="Enter your email"
                                    required>

                            </div>


                            <div class="mb-4">

                                <label class="form-label">
                                    Password
                                </label>

                                <input type="password"
                                    class="form-control"
                                    id="loginPassword"
                                    name="password"
                                    placeholder="Enter your password"
                                    required>

                            </div>


                            <button type="submit"
                                class="btn login-btn"
                                id="loginBtn">

                                Login

                            </button>

                        </form>


                        <p class="account-text">

                            Don't have an account?

                            <a href="./signup.html">
                                Create Account
                            </a>

                        </p>

                    </div>

                </div>


                <div class="col-lg-6 login-image-box">

                    <img src="../images/form.jpg"
                        alt="Student Login"
                        class="login-image">

                    <div class="login-image-text">

                        <h3>Learn. Grow. Achieve.</h3>

                        <p>
                            Your journey to a brighter future starts here.
                        </p>

                    </div>

                </div>

            </div>

        </div>

    </main>


    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <script src="./app.js"></script>

</body>

</html>
