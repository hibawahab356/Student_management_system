<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Portal</title>

    <link rel="stylesheet" href="./style.css">
</head>

<body>

    <div class="main">

    
        <div class="text">

            <p class="small">YOUR DIGITAL LEARNING SPACE</p>

            <h1>
                Welcome to
                <span>Student Portal</span>
            </h1>

            <p class="para">
                Learn, manage and grow in one place.
                Stay connected with your courses,
                assignments and academic journey.
            </p>

            <div class="buttons">

                <a href="./signup.html" class="btn">
                    Get Started →
                </a>

                <a href="./login.html" class="login">
                    Already a student? Login
                </a>

            </div>

        </div>


      
        <div class="video">

            <video autoplay muted loop playsinline>
                <source src="./video/video.mp4" type="video/mp4">
            </video>

            <p class="video-text">
                Your learning journey starts here
            </p>

        </div>

    </div>


    <p class="bottom">
        Learn today. Build your tomorrow.
    </p>






    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <script src="./app.js"></script>
</body>
</html>
